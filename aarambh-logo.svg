<svg xmlns="http://www.w3.org/2000/svg" width="450" height="82" viewBox="0 0 450 82" role="img" aria-labelledby="title desc">
  <title id="title">Aarambh — Swipe right on forever.</title>
  <desc id="desc">Two elegant interlocking wedding rings beside the Aarambh wordmark and tagline.</desc>
  <defs>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd8490"/>
      <stop offset="1" stop-color="#925561"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddc294"/>
      <stop offset="1" stop-color="#b89158"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="29" cy="40" rx="15" ry="25" transform="rotate(-38 29 40)" stroke="url(#rose)" stroke-width="3.2"/>
    <ellipse cx="51" cy="40" rx="15" ry="25" transform="rotate(38 51 40)" stroke="url(#gold)" stroke-width="3.2"/>
    <path d="M40 30.5l1.5 3.2 3.5 1.2-3.5 1.2-1.5 3.3-1.4-3.3-3.6-1.2 3.6-1.2z" fill="#c6a36a" stroke="none"/>
  </g>
  <text x="88" y="45" fill="#3b3032" font-family="Georgia, 'Times New Roman', serif" font-size="36" letter-spacing=".2">Aarambh</text>
  <text x="90" y="66" fill="#80696a" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing=".45">— Swipe right on forever.</text>
</svg>